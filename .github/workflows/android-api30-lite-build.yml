name: Android API 30 lite native build

on:
  push:
    branches: [android-11-api-30]
    paths:
      - '.github/workflows/android-api30-lite-build.yml'
      - 'build_files/android/**'
      - 'build_files/build_environment/cmake/versions.cmake'
      - 'build_files/cmake/platform/platform_android.cmake'
      - 'intern/draco_bridge/**'
      - 'intern/meshoptimizer_bridge/**'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api30-lite-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install host tools and Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-18 lld-18 cmake ninja-build meson pkgconf patchelf \
            git-lfs autoconf automake libtool libtool-bin flex bison yasm nasm zip unzip \
            libffi-dev libssl-dev zlib1g-dev libbz2-dev liblzma-dev libsqlite3-dev \
            libreadline-dev libncurses-dev uuid-dev
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root not set}}"
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'ndk;28.2.13676358'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo 'ANDROID_NDK_VERSION=28.2.13676358' >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo 'ANDROID_ABI=arm64-v8a' >> "$GITHUB_ENV"
          echo 'ANDROID_API=30' >> "$GITHUB_ENV"
          echo 'ANDROID_TARGET_API=34' >> "$GITHUB_ENV"
          echo "BUILD_BASE=$RUNNER_TEMP/blender_build_android_api30_lite" >> "$GITHUB_ENV"
          cmake --version
          clang-18 --version
          python3.13 --version
          grep -F 'Pkg.Revision = 28.2.13676358' "$SDK/ndk/28.2.13676358/source.properties"

      - name: Fetch Blender LFS assets and Linux host libraries
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config --global credential.helper '!f() { echo username=; echo password=; }; f'
          git config lfs.url 'https://projects.blender.org/blender/blender.git/info/lfs'
          MISSING_LFS_OID='38e9b314b65b3a16d005b0a976dbf3f01d05adb0b3e7fd147aca26191eab55ab'
          GIT_TERMINAL_PROMPT=0 git lfs pull --exclude='release/datafiles/splash.png'
          curl --silent --output "$RUNNER_TEMP/blender-splash.png" 'https://media.githubusercontent.com/media/46Neon/blender_for_android/82ff5e77e2442921045df9a52ae9f41dd3d8f7b1/release/datafiles/splash.png'
          printf '%s  %s\n' "$MISSING_LFS_OID" "$RUNNER_TEMP/blender-splash.png" | sha256sum --check
          install -D -m 644 "$RUNNER_TEMP/blender-splash.png" release/datafiles/splash.png
          mkdir -p lib
          git clone --depth 1 --single-branch --branch blender-v5.3-release \
            'https://projects.blender.org/blender/lib-linux_x64.git' lib/linux_x64
          git -C lib/linux_x64 lfs install --local
          git -C lib/linux_x64 config lfs.url 'https://projects.blender.org/blender/lib-linux_x64.git/info/lfs'
          GIT_TERMINAL_PROMPT=0 git -C lib/linux_x64 lfs pull
          test -d lib/linux_x64/tbb/lib
          git -C lib/linux_x64 rev-parse --short HEAD
          df -h . "$RUNNER_TEMP"

      - name: Build the API-30 lite dependency closure from a clean prefix
        shell: bash
        run: |
          set -euo pipefail
          source build_files/android/env.sh
          test "$ANDROID_API" = 30
          test "$ANDROID_ABI" = arm64-v8a
          grep -F 'Pkg.Revision = 28.2.13676358' "$ANDROID_NDK_ROOT/source.properties"
          test ! -e "$BUILD_BASE/lib/android_arm64/.android-build-config"
          bash build_files/android/deps/build.sh \
            zlib zstd deflate imath fmt tbb openexr png pugixml jpeg brotli freetype \
            harfbuzz webp tiff openjpeg expat yamlcpp blosc pystring minizipng \
            opencolorio robinmap openimageio sqlite libffi openssl lzma bzip2 python \
            eigen sse2neon fribidi vulkan_headers meshoptimizer shaderc draco
          LIBDIR="$BUILD_BASE/lib/android_arm64"
          printf 'abi=arm64-v8a\napi=30\nndk=28.2.13676358\n' > "$RUNNER_TEMP/expected-api30-prefix"
          cmp "$RUNNER_TEMP/expected-api30-prefix" "$LIBDIR/.android-build-config"
          test ! -d "$LIBDIR/python/lib/python3.13/site-packages/numpy"
          cat "$LIBDIR/.android-build-config"

      - name: Build and package Blender lite for API 30
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          source build_files/android/env.sh
          test "$ANDROID_API" = 30
          test "$ANDROID_ABI" = arm64-v8a
          BUILD_BASE="$BUILD_BASE" bash build_files/android/build_apk.sh lite

      - name: Verify the real APK and every packaged native ELF
        shell: bash
        run: |
          set -euo pipefail
          source build_files/android/env.sh
          test -x "$ANDROID_LLVM_BIN/llvm-readelf"
          APK="$BUILD_BASE/android_apk_stage_lite/blender-lite.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/api30-lite-badging.txt"
          grep -F "sdkVersion:'30'" "$RUNNER_TEMP/api30-lite-badging.txt"
          grep -F "targetSdkVersion:'34'" "$RUNNER_TEMP/api30-lite-badging.txt"
          mkdir -p "$RUNNER_TEMP/api30-lite-apk"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/api30-lite-apk"
          test -s "$RUNNER_TEMP/api30-lite-apk/lib/arm64-v8a/libblender.so"
          shopt -s nullglob
          LIBS=("$RUNNER_TEMP/api30-lite-apk"/lib/arm64-v8a/*.so)
          test "${#LIBS[@]}" -gt 0
          for LIB in "${LIBS[@]}"; do
            "$ANDROID_LLVM_BIN/llvm-readelf" -h "$LIB" | grep -E 'Machine:.*AArch64' >/dev/null
          done
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  blender-lite.apk\n' "$APK_SHA256" > "$BUILD_BASE/android_apk_stage_lite/blender-lite.apk.sha256"
          stat -c 'APK size: %s bytes' "$APK"
          echo "APK SHA-256: $APK_SHA256"
          echo "Verified ${#LIBS[@]} arm64 native libraries in $APK"
          du -h "$APK" "$RUNNER_TEMP/api30-lite-apk/lib/arm64-v8a/libblender.so"

      - name: Publish direct APK release asset
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: android-api30-lite-${{ github.run_number }}
          name: Blender Android 11 API 30 Lite - build ${{ github.run_number }}
          body: |
            Experimental Blender lite build for Android 11 (API 30), ABI arm64-v8a.
            CI verified APK signature, alignment, package metadata, and native libraries.
            This build has not been tested on a physical phone.
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUILD_BASE }}/android_apk_stage_lite/blender-lite.apk
            ${{ env.BUILD_BASE }}/android_apk_stage_lite/blender-lite.apk.sha256

      - name: Download direct release assets and verify round trip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-api30-lite-${{ github.run_number }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/api30-release.json"
          curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON"
          APK_URL="$(python3 -c 'import json,sys; r=json.load(sys.stdin); print(next(a["browser_download_url"] for a in r["assets"] if a["name"] == "blender-lite.apk"))' < "$RELEASE_JSON")"
          SHA_URL="$(python3 -c 'import json,sys; r=json.load(sys.stdin); print(next(a["browser_download_url"] for a in r["assets"] if a["name"] == "blender-lite.apk.sha256"))' < "$RELEASE_JSON")"
          ROUNDTRIP="$RUNNER_TEMP/api30-release-roundtrip"
          mkdir -p "$ROUNDTRIP"
          curl --fail --location --silent --show-error "$APK_URL" -o "$ROUNDTRIP/blender-lite.apk"
          curl --fail --location --silent --show-error "$SHA_URL" -o "$ROUNDTRIP/blender-lite.apk.sha256"
          (cd "$ROUNDTRIP" && sha256sum --check blender-lite.apk.sha256)
          cmp "$BUILD_BASE/android_apk_stage_lite/blender-lite.apk" "$ROUNDTRIP/blender-lite.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$ROUNDTRIP/blender-lite.apk"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$ROUNDTRIP/blender-lite.apk" | grep -F "sdkVersion:'30'"
          stat -c 'Direct release APK size: %s bytes' "$ROUNDTRIP/blender-lite.apk"
