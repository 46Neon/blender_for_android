name: Android API 30 smoke

on:
  push:
    branches: [android-11-api-30]
    paths:
      - '.github/workflows/android-api30-smoke.yml'
      - 'build_files/android/**'
      - 'build_files/cmake/platform/platform_android.cmake'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api30-toolchain-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 30 NDK and packaging SDK
        run: |
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Compile native toolchain smoke test with pinned NDK 28.2 for API 30 arm64
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root not set}}"
          export ANDROID_NDK_VERSION='28.2.13676358'
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          source build_files/android/env.sh
          grep -F "Pkg.Revision = $ANDROID_NDK_VERSION" "$ANDROID_NDK_ROOT/source.properties"
          test "$ANDROID_API" = 30
          test -f "$ANDROID_TOOLCHAIN_FILE"
          bash build_files/android/configure.sh test
          BUILD="$ANDROID_BUILD_BASE_DEFAULT/build_android_toolchain_test"
          grep -F "$ANDROID_NDK_ROOT" "$BUILD/CMakeCache.txt"
          LIB="$BUILD/libtoolchain_test_lib.so"
          "$ANDROID_LLVM_BIN/llvm-readelf" -h "$LIB" | grep -F 'AArch64'
          "$ANDROID_LLVM_BIN/llvm-readelf" -d "$LIB" | grep -E 'lib(android|log)\.so'

      - name: Build zlib dependency with pinned NDK 28.2 for API 30 arm64
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root not set}}"
          export ANDROID_NDK_VERSION='28.2.13676358'
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export ANDROID_ABI='arm64-v8a'
          export ANDROID_API='30'
          source build_files/android/env.sh
          grep -F "Pkg.Revision = $ANDROID_NDK_VERSION" "$ANDROID_NDK_ROOT/source.properties"
          test "$ANDROID_API" = 30
          test "$ANDROID_ABI" = arm64-v8a
          BUILD_BASE="$RUNNER_TEMP/blender_build_android_api30_zlib" \
            bash build_files/android/deps/build.sh zlib
          BUILD_BASE="$RUNNER_TEMP/blender_build_android_api30_zlib"
          LIBDIR="$BUILD_BASE/lib/android_arm64"
          BUILD="$BUILD_BASE/android_deps_build/work/zlib/build-android"
          grep -F "$ANDROID_NDK_ROOT" "$BUILD/CMakeCache.txt"
          ZLIB="$LIBDIR/zlib/lib/libz.so"
          test -s "$ZLIB"
          "$ANDROID_LLVM_BIN/llvm-readelf" -h "$ZLIB" | grep -E 'Class:[[:space:]]+ELF64'
          "$ANDROID_LLVM_BIN/llvm-readelf" -h "$ZLIB" | grep -E 'Machine:[[:space:]]+AArch64'
          MARKER="$LIBDIR/.android-build-config"
          printf 'abi=arm64-v8a\napi=30\nndk=28.2.13676358\n' > "$RUNNER_TEMP/expected-zlib-build-config"
          cmp "$RUNNER_TEMP/expected-zlib-build-config" "$MARKER"
          cat "$MARKER"

      - name: Build zstd and libdeflate dependencies with pinned NDK 28.2 for API 30 arm64
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root not set}}"
          export ANDROID_NDK_VERSION='28.2.13676358'
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export ANDROID_ABI='arm64-v8a'
          export ANDROID_API='30'
          source build_files/android/env.sh
          grep -F "Pkg.Revision = $ANDROID_NDK_VERSION" "$ANDROID_NDK_ROOT/source.properties"
          test "$ANDROID_API" = 30
          test "$ANDROID_ABI" = arm64-v8a
          BUILD_BASE="$RUNNER_TEMP/blender_build_android_api30_zlib" \
            bash build_files/android/deps/build.sh zstd deflate
          BUILD_BASE="$RUNNER_TEMP/blender_build_android_api30_zlib"
          LIBDIR="$BUILD_BASE/lib/android_arm64"
          grep -F "$ANDROID_NDK_ROOT" "$BUILD_BASE/android_deps_build/work/zstd/build/cmake/build-android/CMakeCache.txt"
          grep -E '^ANDROID_PLATFORM:[^=]+=android-30$' "$BUILD_BASE/android_deps_build/work/zstd/build/cmake/build-android/CMakeCache.txt"
          grep -F "$ANDROID_NDK_ROOT" "$BUILD_BASE/android_deps_build/work/deflate/build-android/CMakeCache.txt"
          grep -E '^ANDROID_PLATFORM:[^=]+=android-30$' "$BUILD_BASE/android_deps_build/work/deflate/build-android/CMakeCache.txt"
          ZSTD="$LIBDIR/zstd/lib/libzstd.so"
          DEFLATE="$LIBDIR/deflate/lib/libdeflate.so"
          test -s "$ZSTD"
          test -s "$DEFLATE"
          for LIB in "$ZSTD" "$DEFLATE"; do
            "$ANDROID_LLVM_BIN/llvm-readelf" -h "$LIB" | grep -E 'Class:[[:space:]]+ELF64'
            "$ANDROID_LLVM_BIN/llvm-readelf" -h "$LIB" | grep -E 'Machine:[[:space:]]+AArch64'
          done
          MARKER="$LIBDIR/.android-build-config"
          printf 'abi=arm64-v8a\napi=30\nndk=28.2.13676358\n' > "$RUNNER_TEMP/expected-zstd-deflate-build-config"
          cmp "$RUNNER_TEMP/expected-zstd-deflate-build-config" "$MARKER"
          cat "$MARKER"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build patched OIDN with TBB and ISPC for API 30 arm64
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root not set}}"
          export ANDROID_NDK_VERSION='28.2.13676358'
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export ANDROID_ABI='arm64-v8a'
          export ANDROID_API='30'
          source build_files/android/env.sh
          python3.13 --version
          BUILD_BASE="$RUNNER_TEMP/blender_build_android_api30_zlib" \
            bash build_files/android/deps/build.sh tbb ispc oidn
          LIBDIR="$RUNNER_TEMP/blender_build_android_api30_zlib/lib/android_arm64"
          OIDN="$LIBDIR/openimagedenoise/lib/libOpenImageDenoise_core.a"
          test -s "$OIDN"
          "$ANDROID_LLVM_BIN/llvm-objdump" -f "$OIDN" | grep -qi aarch64
          if "$ANDROID_LLVM_BIN/llvm-nm" -u "$LIBDIR"/openimagedenoise/lib/*.a | grep -E 'pthread_(get|set)affinity_np'; then
            echo 'OIDN archive still references API-36 pthread affinity symbols' >&2
            exit 1
          fi
          "$ANDROID_LLVM_BIN/llvm-nm" -u "$OIDN" | grep -E 'sched_(get|set)affinity'
          MARKER="$LIBDIR/.android-build-config"
          printf 'abi=arm64-v8a\napi=30\nndk=28.2.13676358\n' > "$RUNNER_TEMP/expected-oidn-build-config"
          cmp "$RUNNER_TEMP/expected-oidn-build-config" "$MARKER"
          cat "$MARKER"

      - name: Install the Gradle version declared by the project
        run: |
          DIST='https://services.gradle.org/distributions/gradle-8.9-bin.zip'
          curl --fail --location "$DIST" --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Gradle APK and check API metadata
        shell: bash
        working-directory: build_files/android/apk
        run: |
          gradle --no-daemon :app:assembleDebug
          APK='app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "sdkVersion:'30'" /tmp/apk-badging.txt
          grep -F "targetSdkVersion:'34'" /tmp/apk-badging.txt
