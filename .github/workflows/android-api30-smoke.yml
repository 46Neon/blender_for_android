name: Android API 30 smoke

on:
  push:
    branches: [android-11-api-30]
    paths:
      - '.github/workflows/android-api30-smoke.yml'
      - 'build_files/android/**'
      - 'build_files/cmake/platform/platform_android.cmake'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api30-toolchain-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 30 NDK and packaging SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.1' \
            'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Compile native toolchain smoke test for API 30 arm64
        shell: bash
        run: |
          source build_files/android/env.sh
          test "$ANDROID_API" = 30
          test -f "$ANDROID_TOOLCHAIN_FILE"
          bash build_files/android/configure.sh test
          LIB="$ANDROID_BUILD_BASE_DEFAULT/build_android_toolchain_test/libtoolchain_test_lib.so"
          "$ANDROID_LLVM_BIN/llvm-readelf" -h "$LIB" | grep -F 'AArch64'
          "$ANDROID_LLVM_BIN/llvm-readelf" -d "$LIB" | grep -E 'lib(android|log)\.so'

      - name: Build Gradle APK and check API metadata
        shell: bash
        working-directory: build_files/android/apk
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug
          APK='app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "sdkVersion:'30'" /tmp/apk-badging.txt
          grep -F "targetSdkVersion:'34'" /tmp/apk-badging.txt
